<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio: Artes - GMRsVoiage</title>

    <!-- ===================================================================
         FAVICON PADRÃO DA PÁGINA
         =================================================================== -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/gif" href="favicon.gif">
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- Fontes Estilo Retrofuturista e UI Clássica -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===================================================================
           PALETA DE CORES & VARIÁVEIS VAPORWAVE / SYNTHWAVE & AERO GLASS
           =================================================================== */
        :root {
            --bg-deep: #060112;
            --bg-grid: #0f0326;
            --purple-neon: #bd00ff;
            --purple-deep: #6f00ff;
            --pink-neon: #ff007f;
            --pink-hot: #ff54b0;
            --cyan-neon: #00f0ff;
            --blue-aero: #0084ff;
            --yellow-sun: #ffe600;
            --text-main: #ffffff;
            --text-muted: #b8a9cf;
            --glass-bg: rgba(18, 5, 38, 0.75);
            --glass-border: rgba(189, 0, 255, 0.45);
            --wireframe-line: rgba(189, 0, 255, 0.85);
            --shadow-neon: 0 0 15px rgba(189, 0, 255, 0.5), 0 0 30px rgba(255, 0, 127, 0.25);
            --shadow-cyan: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Rajdhani', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(189, 0, 255, 0.15), transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.1), transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(255, 0, 127, 0.12), transparent 45%);
            background-attachment: fixed;
        }

        /* Grade Synthwave Animada em Perspectiva no Fundo */
        .retro-grid-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 35vh;
            perspective: 350px;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.35;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
        }

        .retro-grid-lines {
            position: absolute;
            width: 200%;
            left: -50%;
            height: 200%;
            bottom: 0;
            background-image: 
                linear-gradient(to right, var(--purple-neon) 1px, transparent 1px),
                linear-gradient(to bottom, var(--pink-neon) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(65deg);
            transform-origin: bottom center;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 500px; }
        }

        /* Scanlines CRT Retrô */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            opacity: 0.55;
        }

        /* ===================================================================
           BARRA SUPERIOR (HEADER / TOPBAR)
           =================================================================== */
        header.top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: rgba(6, 1, 18, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 2px solid var(--purple-neon);
            box-shadow: 0 4px 25px rgba(189, 0, 255, 0.35);
        }

        /* Canto Superior Esquerdo: Ícone Animado + Texto "Artes" */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .icon-wrapper {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(189, 0, 255, 0.3), rgba(0, 240, 255, 0.2));
            border: 1.5px solid var(--pink-neon);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.6), inset 0 0 8px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .icon-wrapper:hover {
            transform: scale(1.08) rotate(3deg);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8), inset 0 0 12px rgba(255, 0, 127, 0.6);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            border-radius: 4px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff 0%, var(--cyan-neon) 50%, var(--pink-neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--purple-neon);
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(189, 0, 255, 0.7);
        }

        /* ===================================================================
           CANTO SUPERIOR DIREITO: REDES SOCIAIS (COM SIMPLE ICONS)
           =================================================================== */
        .social-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(22, 7, 45, 0.8);
            border: 1px solid var(--purple-neon);
            border-radius: 24px;
            padding: 6px 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 38px;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.0) 100%);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            pointer-events: none;
        }

        .social-link:hover {
            background: linear-gradient(135deg, rgba(111, 0, 255, 0.7), rgba(255, 0, 127, 0.6));
            border-color: var(--cyan-neon);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .social-link.github:hover { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }
        .social-link.twitch:hover { border-color: #a970ff; box-shadow: 0 0 15px rgba(169, 112, 255, 0.7); }
        .social-link.instagram:hover { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.7); }
        .social-link.youtube:hover { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }

        /* Ícone Simple Icons (SVG limpo via CDN com filtro branco nítido) */
        .social-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            transition: transform 0.3s ease, filter 0.3s ease;
            flex-shrink: 0;
        }

        .social-link:hover .social-icon {
            transform: scale(1.15);
        }

        .social-text {
            max-width: 0;
            opacity: 0;
            white-space: nowrap;
            overflow: hidden;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 0;
            transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, padding 0.3s ease;
        }

        .social-link:hover .social-text {
            max-width: 200px;
            opacity: 1;
            padding-left: 8px;
            padding-right: 4px;
        }

        /* ===================================================================
           CORPO PRINCIPAL & GALERIA DE ARTES MASONRY AUTO-REAJUSTÁVEL
           =================================================================== */
        main.gallery-container {
            position: relative;
            z-index: 10;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        .gallery-wireframe {
            column-count: 3;
            column-gap: 20px;
            width: 100%;
        }

        @media (min-width: 1500px) {
            .gallery-wireframe {
                column-count: 4;
            }
        }

        @media (max-width: 1100px) {
            .gallery-wireframe {
                column-count: 2;
                column-gap: 16px;
            }
        }

        @media (max-width: 600px) {
            .gallery-wireframe {
                column-count: 1;
            }
        }

        .art-tile {
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            position: relative;
            background: rgba(14, 4, 30, 0.75);
            border: 2px solid var(--purple-neon);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(189, 0, 255, 0.2);
        }

        .art-tile:hover {
            transform: translateY(-6px);
            border-color: var(--cyan-neon);
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.35), 0 0 20px rgba(189, 0, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .tile-window-bar {
            height: 28px;
            background: linear-gradient(90deg, #1b0338 0%, #35085e 60%, #17042a 100%);
            border-bottom: 1px solid var(--purple-neon);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            position: relative;
        }

        .tile-window-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        .tile-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--cyan-neon);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        .tile-dots {
            display: flex;
            gap: 5px;
        }

        .tile-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }
        .art-tile:hover .tile-dot:nth-child(1) { background: #ff007f; box-shadow: 0 0 6px #ff007f; }
        .art-tile:hover .tile-dot:nth-child(2) { background: #ffe600; box-shadow: 0 0 6px #ffe600; }
        .art-tile:hover .tile-dot:nth-child(3) { background: #00f0ff; box-shadow: 0 0 6px #00f0ff; }

        .tile-img-container {
            position: relative;
            width: 100%;
            background: #090114;
            overflow: hidden;
            display: block;
        }

        .tile-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .art-tile:hover .tile-img {
            transform: scale(1.04);
        }

        .tile-hover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9, 1, 20, 0.15) 0%, rgba(14, 4, 34, 0.94) 55%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            opacity: 0;
            backdrop-filter: blur(4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translateY(8px);
        }

        .art-tile:hover .tile-hover-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .tile-badge {
            align-self: flex-start;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--pink-neon);
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }

        .tile-art-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
        }

        .tile-excerpt {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .tile-click-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cyan-neon);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===================================================================
           MODAL / JANELA AERO GLASS SYNTHWAVE (LADO A LADO)
           =================================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(3, 0, 10, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            position: relative;
            width: 95%;
            max-width: 1240px;
            max-height: 90vh;
            background: rgba(18, 5, 38, 0.95);
            border: 2px solid var(--purple-neon);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(189, 0, 255, 0.5), 0 20px 60px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.92) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2), box-shadow 0.3s ease;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1) translateY(0);
        }

        .window-titlebar {
            height: 42px;
            background: linear-gradient(180deg, #3d0e7a 0%, #200445 50%, #110226 51%, #090117 100%);
            border-bottom: 2px solid var(--pink-neon);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            position: relative;
        }

        .window-titlebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }

        .window-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .window-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
        }

        .window-title-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
        }

        .win-btn {
            width: 28px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .win-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            border-color: var(--cyan-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .win-btn.close:hover {
            background: #ff0055;
            border-color: #ffffff;
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.9);
        }

        .window-body {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            flex: 1;
            overflow: hidden;
            min-height: 480px;
            max-height: calc(90vh - 42px);
        }

        .modal-image-pane {
            position: relative;
            background: #05000a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 2px solid var(--purple-neon);
            overflow: hidden;
        }

        .modal-artwork {
            max-width: 100%;
            max-height: 72vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(189, 0, 255, 0.3);
            border: 1px solid rgba(189, 0, 255, 0.4);
            transition: transform 0.3s ease;
        }

        .modal-text-pane {
            display: flex;
            flex-direction: column;
            padding: 28px;
            background: rgba(13, 3, 28, 0.95);
            overflow-y: auto;
        }

        .modal-text-pane::-webkit-scrollbar {
            width: 8px;
        }
        .modal-text-pane::-webkit-scrollbar-track {
            background: rgba(10, 2, 20, 0.8);
        }
        .modal-text-pane::-webkit-scrollbar-thumb {
            background: var(--purple-neon);
            border-radius: 4px;
            box-shadow: 0 0 8px var(--purple-neon);
        }

        .modal-header-meta {
            border-bottom: 1px dashed rgba(189, 0, 255, 0.5);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .modal-category-tag {
            display: inline-block;
            background: linear-gradient(90deg, var(--purple-neon), var(--pink-neon));
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .modal-art-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            margin-bottom: 8px;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
        }

        .meta-item-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cyan-neon);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-item-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-text-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e3d9f2;
            white-space: pre-line;
            user-select: text;
        }

        .modal-nav-footer {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid rgba(189, 0, 255, 0.3);
        }

        .modal-nav-btn {
            background: rgba(30, 8, 60, 0.8);
            border: 1px solid var(--purple-neon);
            color: var(--cyan-neon);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .modal-nav-btn:hover {
            background: var(--purple-neon);
            color: #ffffff;
            box-shadow: 0 0 15px var(--purple-neon);
            border-color: #ffffff;
        }

        /* Rodapé Retrô */
        footer.retro-footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(189, 0, 255, 0.4);
            background: rgba(6, 1, 15, 0.85);
            backdrop-filter: blur(10px);
            margin-top: 40px;
        }

        .footer-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .footer-neon {
            color: var(--pink-neon);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }

        @media (max-width: 900px) {
            .window-body {

                padding: 10px 14px;

                font-size: 1.2rem;

            }
            main.gallery-container {
                padding: 14px;
            }
            .modal-window {
                width: 98%;
                max-height: 94vh;
            }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->

        <!-- REDES SOCIAIS COM SIMPLE ICONS (CDN) -->

    <!-- MODAL WINDOW -->
    <div class="modal-overlay" id="artModal" onclick="handleBackdropClick(event)">
        <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modalArtTitle">
            <div class="window-titlebar">

                <div class="window-controls">
                    <button class="win-btn" onclick="toggleMaximizeModal()" title="Maximizar / Restaurar">□</button>
                    <button class="win-btn close" onclick="closeModal()" title="Fechar (ESC)">✕</button>

                    </div>

        </p>
    </footer>

    <!-- JAVASCRIPT: AUTO-DESCOBERTA AUTOMÁTICA -->
    <script>
        const GITHUB_REPO = "GMRsVoiage/portfolio-artes";

        const FALLBACK_ARTES = [
            "inohid-streamdeck",
            "algodao-doce-festas",
            "Lives Background"
        ];

        let currentIndex = 0;
        let galleryData = [];

        async function autoDiscoverPortfolioItems() {
            try {
                const imgRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/imagens`);
                if (imgRes.ok) {
                    const imgFiles = await imgRes.json();
                    const discoveredNames = imgFiles
                        .filter(file => file.type === 'file' && /\.(png|jpe?g|gif|svg|webp)$/i.test(file.name))
                        .map(file => file.name.replace(/\.[^/.]+$/, ""));

                    if (discoveredNames.length > 0) {
                        return Array.from(new Set(discoveredNames));
                    }
                }
            } catch (e) {
                console.log("Usando fallback de artes.");
            }

            return FALLBACK_ARTES;
        }

        function findImageSrc(baseName) {
            const extensions = ['.png', '.gif', '.jpg', '.jpeg', '.webp', '.svg'];
            return new Promise((resolve) => {
                let index = 0;
                function tryNext() {
                    if (index >= extensions.length) {
                        resolve(`imagens/${encodeURIComponent(baseName)}.png`);
                        return;
                    }
                    const ext = extensions[index++];
                    const testUrl = `imagens/${encodeURIComponent(baseName)}${ext}`;
                    const img = new Image();
                    img.onload = () => resolve(testUrl);
                    img.onerror = () => tryNext();
                    img.src = testUrl;
                }
                tryNext();
            });
        }

        async function fetchTextData(baseName) {
            let titulo = baseName.replace(/[-_]/g, ' ');
            let categoria = "Arte / Design";
            let data = "2026";
            let ferramentas = "Design Digital";
            let descricao = "";

            try {
                const response = await fetch(`texto/${encodeURIComponent(baseName)}.txt`);
                if (response.ok) {
                    const rawText = await response.text();
                    const lines = rawText.split('\n');
                    let descricaoLines = [];
                    let isDescricao = false;

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('Título:')) {
                            titulo = trimmed.replace('Título:', '').trim();
                        } else if (trimmed.startsWith('Categoria:')) {
                            categoria = trimmed.replace('Categoria:', '').trim();
                        } else if (trimmed.startsWith('Data:')) {
                            data = trimmed.replace('Data:', '').trim();
                        } else if (trimmed.startsWith('Ferramentas:')) {
                            ferramentas = trimmed.replace('Ferramentas:', '').trim();
                        } else if (trimmed.startsWith('Descrição do Conceito:') || trimmed.startsWith('Descrição:')) {
                            isDescricao = true;
                        } else if (isDescricao) {
                            descricaoLines.push(line);
                        }
                    }

                    descricao = descricaoLines.length > 0 ? descricaoLines.join('\n').trim() : rawText.trim();
                }
            } catch (err) {
                console.warn(`Não foi possível carregar texto/${baseName}.txt:`, err);
            }

            return { titulo, categoria, data, ferramentas, descricao };
        }

        async function renderGallery() {
            const galleryElement = document.getElementById('artGallery');
            galleryElement.innerHTML = '';
            galleryData = [];

            const artNames = await autoDiscoverPortfolioItems();

            for (let i = 0; i < artNames.length; i++) {
                const baseName = artNames[i];
                const imageSrc = await findImageSrc(baseName);
                const textInfo = await fetchTextData(baseName);

                const item = {
                    baseName,
                    imageSrc,
                    ...textInfo
                };
                galleryData.push(item);

                const tile = document.createElement('article');
                tile.className = 'art-tile';
                tile.setAttribute('onclick', `openModal(${i})`);
                tile.setAttribute('role', 'button');
                tile.setAttribute('tabindex', '0');
                tile.setAttribute('aria-label', `Ver detalhes de ${item.titulo}`);

                tile.innerHTML = `
                    <div class="tile-window-bar">
                        <span class="tile-title">${item.titulo}</span>
                        <div class="tile-dots">
                            <span class="tile-dot"></span>
                            <span class="tile-dot"></span>
                            <span class="tile-dot"></span>
                        </div>
                    </div>
                    <div class="tile-img-container">
                        <img src="${item.imageSrc}" alt="${item.titulo}" class="tile-img" loading="lazy">
                        <div class="tile-hover-overlay">
                            <span class="tile-badge">${item.categoria}</span>
                            <h3 class="tile-art-name">${item.titulo}</h3>
                            <p class="tile-excerpt">${item.descricao}</p>
                            <span class="tile-click-hint">Clique para expandir ↗</span>
                        </div>
                    </div>
                `;

                tile.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openModal(i);
                    }
                });

                galleryElement.appendChild(tile);
            }
        }

        function openModal(index) {
            currentIndex = index;
            const item = galleryData[index];
            if (!item) return;

            document.getElementById('modalArtImg').src = item.imageSrc;
            document.getElementById('modalArtImg').alt = item.titulo;
            document.getElementById('modalWindowTitle').innerText = `Visualizador de Arte // ${item.titulo}`;
            document.getElementById('modalArtTitle').innerText = item.titulo;
            document.getElementById('modalArtCategory').innerText = item.categoria;
            document.getElementById('modalArtDate').innerText = item.data;
            document.getElementById('modalArtTools').innerText = item.ferramentas;
            document.getElementById('modalArtDescription').innerText = item.descricao;

            const modal = document.getElementById('artModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('artModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function handleBackdropClick(event) {
            if (event.target.id === 'artModal') {
                closeModal();
            }
        }

        function navigateModal(direction) {
            let nextIndex = currentIndex + direction;
            if (nextIndex < 0) nextIndex = galleryData.length - 1;
            if (nextIndex >= galleryData.length) nextIndex = 0;
            openModal(nextIndex);
        }

        function toggleMaximizeModal() {
            const modalWindow = document.querySelector('.modal-window');
            if (modalWindow.style.maxWidth === '98vw') {
                modalWindow.style.maxWidth = '1240px';
                modalWindow.style.maxHeight = '90vh';
            } else {
                modalWindow.style.maxWidth = '98vw';
                modalWindow.style.maxHeight = '96vh';
            }
        }

        window.addEventListener('keydown', (e) => {
            const modal = document.getElementById('artModal');
            if (!modal.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowRight') {
                navigateModal(1);
            } else if (e.key === 'ArrowLeft') {
                navigateModal(-1);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
        });
    </script>
</body>
